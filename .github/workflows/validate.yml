name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # change stream 係由 git history 重建出嚟（§7.2 步驟 4），所以測試同
          # build 都需要完整 history。預設 fetch-depth: 1 淨係得一個 commit，
          # rebuildAllChangeEvents 會咩都搵唔到而靜靜哋通過。
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: typecheck
        run: npm run typecheck

      # §4.6 canonical formatting —— deterministic diff 係人手審核嘅前提
      - name: canonical format
        run: npm run fmt:check

      # schemas/*.json 一定要同 Zod 同步（外部 agent 讀嘅係呢啲檔）
      - name: json schema in sync
        run: npm run schema:check

      - name: validate data
        run: npm run validate:data

      # fetchSource(url, 'js') integration test 要呢兩個先行得，pull_request
      # 嚟自 fork 嗰陣 secrets 唔會傳過去——test 本身已經 skipIf 冇憑證，唔會累
      # CI fail，淨係嗰條 test 會 skip。
      - name: test
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: npm test
