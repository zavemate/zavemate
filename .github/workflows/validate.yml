name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: typecheck
        run: npm run typecheck

      # §4.6 canonical formatting —— deterministic diff 係人手審核嘅前提
      - name: canonical format
        run: npm run fmt:check

      # schemas/*.json 一定要同 Zod 同步（外部 agent 讀嘅係呢啲檔）
      - name: json schema in sync
        run: npm run schema:check

      - name: validate data
        run: npm run validate:data

      - name: test
        run: npm test
