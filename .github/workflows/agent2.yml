name: agent2

# §6.5：逢二/四/六 04:00 HKT（UTC+8）= 逢一/三/五 20:00 UTC。
#
# 比 Agent 1（逢星期一）密，因為兩個 agent 解緊唔同問題：Agent 1 監察銀行官方
# 條款（改動罕有但要準），Agent 2 追限時優惠（銀行特登散佈落第三方平台，快同
# 早知先有價值）。
on:
  schedule:
    - cron: '0 20 * * 1,3,5'
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  statuses: write

concurrency:
  group: agent2
  cancel-in-progress: false

jobs:
  agent2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: 跑 Agent 2
        id: agent2
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx tsx packages/agent2-promo/src/cli.ts

      # 同 agent1.yml 一樣：GitHub 唔會為 GITHUB_TOKEN 開嘅 PR 觸發 workflow
      # （防遞迴），所以 validate 永遠唔會自己喺呢個 PR 上面跑，而 branch
      # protection 要求佢——唔自己補個 status 就會永遠 BLOCKED。
      - name: 驗證 PR 內容，補返 validate status
        if: steps.agent2.outputs.branch != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          BRANCH='${{ steps.agent2.outputs.branch }}'
          git fetch --depth=1 origin "$BRANCH"
          git checkout FETCH_HEAD
          SHA=$(git rev-parse HEAD)

          if npm run typecheck && npm run fmt:check && npm run schema:check && npm run validate:data; then
            STATE=success
            DESC='資料驗證通過（agent PR 只改 data/，冇跑 network integration test）'
          else
            STATE=failure
            DESC='資料驗證失敗——唔好 merge'
          fi

          gh api "repos/${{ github.repository }}/statuses/$SHA" \
            -f state="$STATE" \
            -f context=validate \
            -f description="$DESC" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          [ "$STATE" = success ]
