name: agent2

# §6.5：逢二/四/六 04:00 HKT（UTC+8）= 逢一/三/五 20:00 UTC。
#
# 比 Agent 1（逢星期一）密，因為兩個 agent 解緊唔同問題：Agent 1 監察銀行官方
# 條款（改動罕有但要準），Agent 2 追限時優惠（銀行特登散佈落第三方平台，快同
# 早知先有價值）。
on:
  schedule:
    - cron: '0 20 * * 1,3,5'
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  statuses: write
  actions: write # auto-merge 之後要 dispatch deploy.yml（見下面）

concurrency:
  group: agent2
  cancel-in-progress: false

jobs:
  agent2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: 跑 Agent 2
        id: agent2
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx tsx packages/agent2-promo/src/cli.ts

      # 同 agent1.yml 一樣：GitHub 唔會為 GITHUB_TOKEN 開嘅 PR 觸發 workflow
      # （防遞迴），所以 validate 永遠唔會自己喺呢個 PR 上面跑，而 branch
      # protection 要求佢——唔自己補個 status 就會永遠 BLOCKED。
      - name: 驗證 PR 內容，補返 validate status
        if: steps.agent2.outputs.branch != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          BRANCH='${{ steps.agent2.outputs.branch }}'
          git fetch --depth=1 origin "$BRANCH"
          git checkout FETCH_HEAD
          SHA=$(git rev-parse HEAD)

          if npm run typecheck && npm run fmt:check && npm run schema:check && npm run validate:data; then
            STATE=success
            DESC='資料驗證通過（agent PR 只改 data/，冇跑 network integration test）'
          else
            STATE=failure
            DESC='資料驗證失敗——唔好 merge'
          fi

          gh api "repos/${{ github.repository }}/statuses/$SHA" \
            -f state="$STATE" \
            -f context=validate \
            -f description="$DESC" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          [ "$STATE" = success ]

      # 同 agent1.yml 一樣：淨係更新 source timestamp／hash 嘅 PR 自動 merge。
      # Agent 2 逢二／四／六跑，噪音比 Agent 1 多三倍，而大部分時間銀行冇出
      # 新優惠——嗰啲 PR 人睇同唔睇冇分別。
      #
      # ⚠️ 有任何優惠新增／更新／過期／提議新來源都要人睇。
      - name: 零改動嘅 PR 自動 merge
        if: steps.agent2.outputs.auto_mergeable == 'true' && steps.agent2.outputs.pr_url != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge "${{ steps.agent2.outputs.pr_url }}" --squash --delete-branch
          echo "零改動，已自動 merge：${{ steps.agent2.outputs.pr_url }}"

      # ⚠️ Auto-merge 之後一定要自己叫 deploy。
      #
      # GITHUB_TOKEN 造成嘅 push **唔會**觸發其他 workflow（GitHub 防遞迴）。
      # 呢個機制我哋已經中過一次——PR #90 嗰陣係 GITHUB_TOKEN 開嘅 PR 唔會
      # 觸發 validate.yml，所以呢個 workflow 要自己 post commit status。
      #
      # 而家同一個機制喺最後一哩再咬一次：auto-merge 成功、資料入咗 main，
      # 但 deploy.yml 冇跑，R2 同 API 停喺舊版本。實測 2026-08-29 run
      # 33226784667——PR #170 由 app/github-actions merge 咗，main 去到
      # 6f26da3，但 deploy 最後一次係 8d15903。
      #
      # 呢個係最惡劣嗰種靜靜錯：git 話今日核實過，API 服務緊兩日前嘅嘢，
      # 兩邊各自睇都好正常。
      #
      # workflow_dispatch 同 repository_dispatch 係防遞迴機制嘅兩個例外，
      # 所以 GITHUB_TOKEN 叫得郁——但要 `actions: write` 權限。
      - name: Auto-merge 咗就即刻叫 deploy
        if: steps.agent2.outputs.auto_mergeable == 'true' && steps.agent2.outputs.pr_url != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref main
